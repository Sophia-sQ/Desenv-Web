<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Painel de Saúde 2.0</title><br><br><br>
    <!-- ATIVIDADE EXTRA-CLASSE: Vincule sua folha de estilos (style.css) abaixo -->
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <main class="container">
        <h1>Painel de Saúde 2.0</h1>
        <!-- =========================================================
1. FORMULÁRIO DE CADASTRO DO PACIENTE
Preencha os atributos que faltam (id, type, step, etc.)
========================================================= -->
        <form id="form_paciente">
            <!-- field Nome -->
            <div class="field">
                <label for="nome">Nome:</label>
                <input type="text" id="nome_paciente" placeholder="Ex: Maria Silva"
                    required><br>
            </div>
            <!-- field Altura -->
            <div class="field">
                <label for="altura">Altura (m):</label>
                <input type="number" id="altura"
                    step="0.01" placeholder="Ex: 1.65" required><br>
            </div>
            <!-- field Peso -->
               
            <div class="field">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso"
                    step="0.01" placeholder="Ex: 68.5" required><br>
            </div>
            <!-- Botão de Envio -->
            <button type="submit">
                Cadastrar Paciente
            </button>
        </form>
        <!-- =========================================================
2. TABELA DE RELATÓRIO DE PACIENTES
========================================================= -->
        <section class="tabela-container">
            <h2>Relatório de Indicadores</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Altura (m)</th>
                        <th>Peso (kg)</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                    </tr>
                </thead>
                <!-- O corpo da tabela receberá as linhas geradas pelo JS -->
                
                <tbody id="corpo_tabela">
                    <!-- As linhas serão injetadas dinamicamente aqui via JavaScript -->
                </tbody>
            </table>
        </section>
    </main>
    <!-- =========================================================
3. IMPORTAÇÃO DO SCRIPT JAVASCRIPT
========================================================= -->
    <script src="app.js"></script>
</body>

</html>
